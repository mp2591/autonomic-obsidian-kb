name: Source integrity

on:
  push:
    branches: [main, 'fix/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Capture exact committed source and identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/source-integrity
          git archive --format=tar.gz HEAD > /tmp/source-integrity/source.tar.gz
          git rev-parse HEAD HEAD^{tree} > /tmp/source-integrity/source-tree.txt
          git ls-tree -r HEAD > /tmp/source-integrity/files.txt
          cd /tmp/source-integrity
          sha256sum source.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: source-${{ github.sha }}-${{ github.run_attempt }}
          path: /tmp/source-integrity
          if-no-files-found: error
          retention-days: 14
