name: Repair preserved v2 files

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/sota-memory-v2'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sota-memory-v2
          fetch-depth: 0
      - name: Restore exact preserved index.py
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/index.py.gz.b64" <<'B64'

B64
          base64 --decode "$RUNNER_TEMP/index.py.gz.b64" | gzip -dc > src/autonomic_kb/index.py
          echo "1152b53ce80cb1520559f84d9239e9c5de95ba04d4be67510c446ef9fcd993cd  src/autonomic_kb/index.py" | sha256sum --check
      - name: Restore exact preserved v2 core tests
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/test_v2_core.py.gz.b64" <<'B64'

B64
          base64 --decode "$RUNNER_TEMP/test_v2_core.py.gz.b64" | gzip -dc > tests/test_v2_core.py
          echo "3dc270cc5376fa2cbded83171580d24004d272bab0f2acbfbf36e1fd1f0aeebb  tests/test_v2_core.py" | sha256sum --check
      - name: Verify repaired files and suites
        run: |
          python -m pip install -e '.[dev]'
          python -m compileall -q src tests
          python -m unittest tests.test_v2_incremental tests.test_v2_core -v
          python -m pytest -q
      - name: Commit only repaired source/test files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/autonomic_kb/index.py tests/test_v2_core.py
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'Fix persistent incremental index manifest'
          git push origin HEAD:feat/sota-memory-v2
