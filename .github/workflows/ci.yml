name: V2 recovery

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  materialize-v2:
    name: Materialize verified v2 source
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/sota-memory-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sota-memory-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Reassemble checksum-locked v2 tree
        shell: bash
        run: |
          set -euo pipefail
          cat .ci-bootstrap/part-*.b64 | base64 --decode > "$RUNNER_TEMP/sota-v2-overlay.tar.gz"
          echo "0c390ca9e64dd1701823f28f8909c64037b6141724fcaa76eacd16f67cf625b3  $RUNNER_TEMP/sota-v2-overlay.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/v2"
          tar -xzf "$RUNNER_TEMP/sota-v2-overlay.tar.gz" -C "$RUNNER_TEMP/v2"
      - name: Overlay source while preserving workflow files
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --exclude='.git/' --exclude='.pytest_cache/' "$RUNNER_TEMP/v2/" ./
          rm -rf .ci-bootstrap
          rm -f examples/sample-vault/.kb/code-graph.json examples/sample-vault/.kb/traces.jsonl
          git restore --source=HEAD -- .github/workflows/ci.yml .github/workflows/bootstrap-sota-v2.yml
      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m compileall -q src scripts tests
          python -m unittest discover -s tests -v
          pytest
          kb --vault examples/sample-vault index --rebuild
          kb --vault examples/sample-vault retrieve "run the complete test suite" --budget 180
          python benchmarks/run.py
          git diff --check
      - name: Commit and push non-workflow source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mapfile -d '' tracked < <(git diff --name-only --diff-filter=ACMRTUXB -z)
          mapfile -d '' deleted < <(git diff --name-only --diff-filter=D -z)
          mapfile -d '' untracked < <(git ls-files --others --exclude-standard -z)
          if ((${#tracked[@]})); then git add -- "${tracked[@]}"; fi
          if ((${#deleted[@]})); then git add -u -- "${deleted[@]}"; fi
          if ((${#untracked[@]})); then git add -- "${untracked[@]}"; fi
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo 'Workflow path unexpectedly staged' >&2
            exit 1
          fi
          git diff --cached --check
          git diff --cached --stat
          test -n "$(git diff --cached --name-only)"
          git commit -m 'Implement evidence-driven autonomic memory v2'
          git push origin HEAD:feat/sota-memory-v2
