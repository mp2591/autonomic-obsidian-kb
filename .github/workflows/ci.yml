name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: PYTHONPATH=src python -m compileall -q src tests
      - name: Unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: |
          PYTHONPATH=src python -m autonomic_kb --vault examples/sample-vault index --rebuild
          PYTHONPATH=src python -m autonomic_kb --vault examples/sample-vault retrieve "run the complete test suite" --budget 180
      - name: Benchmark guardrail
        run: PYTHONPATH=src python benchmarks/run.py
