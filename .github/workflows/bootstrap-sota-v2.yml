name: Materialize state-of-the-art memory v2

on:
  push:
    branches:
      - feat/sota-memory-v2
    paths:
      - .github/workflows/bootstrap-sota-v2.yml

permissions:
  contents: write

concurrency:
  group: materialize-sota-memory-v2
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out publication branch
        uses: actions/checkout@v4
        with:
          ref: feat/sota-memory-v2
          fetch-depth: 0

      - name: Reassemble and verify preserved source tree
        shell: bash
        run: |
          set -euo pipefail
          cat .ci-bootstrap/part-*.b64 | base64 --decode > "$RUNNER_TEMP/sota-v2-overlay.tar.gz"
          echo "0c390ca9e64dd1701823f28f8909c64037b6141724fcaa76eacd16f67cf625b3  $RUNNER_TEMP/sota-v2-overlay.tar.gz" | sha256sum --check
          while IFS= read -r entry; do
            entry="${entry#./}"
            case "$entry" in
              ""|/*|../*|*/../*|*/..) echo "Unsafe archive path: $entry" >&2; exit 1 ;;
            esac
          done < <(tar -tzf "$RUNNER_TEMP/sota-v2-overlay.tar.gz")
          mkdir "$RUNNER_TEMP/v2"
          tar -xzf "$RUNNER_TEMP/sota-v2-overlay.tar.gz" -C "$RUNNER_TEMP/v2"

      - name: Overlay actual v2 source
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --exclude='.git/' --exclude='.pytest_cache/' "$RUNNER_TEMP/v2/" ./
          rm -rf .ci-bootstrap
          rm -f .github/workflows/bootstrap-sota-v2.yml

      - name: Verify materialized source before persistence
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '.[dev]'
          python -m compileall -q src scripts tests
          python -m unittest discover -s tests -v
          pytest
          ruff check src tests scripts
          kb --vault examples/sample-vault index --rebuild
          kb --vault examples/sample-vault retrieve "run the complete test suite" --budget 180
          python benchmarks/run.py
          git diff --check

      - name: Commit and push actual v2 tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          mapfile -d '' tracked < <(git diff --name-only -z)
          mapfile -d '' deleted < <(git diff --name-only --diff-filter=D -z)
          mapfile -d '' untracked < <(git ls-files --others --exclude-standard -z)

          if ((${#tracked[@]})); then git add -- "${tracked[@]}"; fi
          if ((${#deleted[@]})); then git add -u -- "${deleted[@]}"; fi
          if ((${#untracked[@]})); then git add -- "${untracked[@]}"; fi

          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No materialization changes.'
            exit 0
          fi
          git commit -m 'Implement evidence-driven autonomic memory v2'
          git push origin HEAD:feat/sota-memory-v2
