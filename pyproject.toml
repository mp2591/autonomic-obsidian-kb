[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomic-obsidian-kb"
version = "0.3.0"
description = "Evidence-driven, token-economical autonomic Obsidian knowledge infrastructure for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "autonomic-obsidian-kb contributors"}]
keywords = ["obsidian", "ai-agents", "memory", "knowledge-base", "token-optimization", "provenance"]
dependencies = ["jsonschema>=4.23", "PyYAML>=6.0", "packaging>=24"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff==0.9.0"]
embeddings = ["sentence-transformers>=3.4"]

[project.scripts]
kb = "autonomic_kb.cli:main"

[project.urls]
Repository = "https://github.com/mp2591/autonomic-obsidian-kb"
Issues = "https://github.com/mp2591/autonomic-obsidian-kb/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.setuptools.package-data]
autonomic_kb = ["data/*.json"]
