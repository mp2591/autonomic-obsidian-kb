[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomic-obsidian-kb"
version = "0.1.0"
description = "Token-economical, autonomic Obsidian knowledge infrastructure for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "autonomic-obsidian-kb contributors"}]
keywords = ["obsidian", "ai-agents", "memory", "knowledge-base", "token-optimization"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]
embeddings = ["sentence-transformers>=3"]

[project.scripts]
kb = "autonomic_kb.cli:main"

[project.urls]
Repository = "https://github.com/mp2591/autonomic-obsidian-kb"
Issues = "https://github.com/mp2591/autonomic-obsidian-kb/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
